name: reconcile

# Nightly: copy every observation batch from the private batch bucket, run the reconciler,
# validate, and open a PR with the world/ changes. The bucket is only writable by the
# ingest service, which verifies each batch's signature, so the batches are trusted here
# (--trust-unknown) and this job never sees contributor keys.
#
# The PR is opened with a GitHub App token when the app is configured (repository variable
# RECONCILE_APP_CLIENT_ID, secret RECONCILE_APP_PRIVATE_KEY), so the normal ci checks run on
# it and it merges itself once they pass. Without the app it falls back to GITHUB_TOKEN,
# whose PRs do not trigger ci; validate runs here either way.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency: reconcile

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  reconcile:
    if: github.repository == 'wowlayerup-forever/opendata'
    runs-on: ubuntu-latest
    env:
      CONFIGURED: ${{ secrets.GCP_WIF_PROVIDER != '' }}
    steps:
      - name: GCP configured?
        if: env.CONFIGURED != 'true'
        run: echo "::notice::GCP secrets are not set for this repository yet; nothing to reconcile."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CONFIGURED == 'true'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: env.CONFIGURED == 'true'
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
        if: env.CONFIGURED == 'true'
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        if: env.CONFIGURED == 'true'
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_RECONCILE_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: env.CONFIGURED == 'true'
      - name: Fetch batches
        if: env.CONFIGURED == 'true'
        run: |
          mkdir -p .cache/batches-remote
          if gcloud storage ls "gs://${{ secrets.GCP_BATCH_BUCKET }}/batches/" > /dev/null 2>&1; then
            gcloud storage cp -r "gs://${{ secrets.GCP_BATCH_BUCKET }}/batches" .cache/batches-remote/ --quiet
          fi
          echo "batches: $(find .cache/batches-remote -name '*.json' | wc -l)"
          # exclusions are kept in the private bucket, not in this public repo
          gcloud storage cp "gs://${{ secrets.GCP_BATCH_BUCKET }}/control/exclusions.json" .cache/exclusions.json --quiet 2>/dev/null \
            || echo '{}' > .cache/exclusions.json
          gcloud storage cp "gs://${{ secrets.GCP_BATCH_BUCKET }}/control/pseudonym.key" .cache/pseudonym.key --quiet 2>/dev/null || true
      - name: Reconcile
        if: env.CONFIGURED == 'true'
        run: |
          python tools/reconcile.py .cache/batches-remote --trust-unknown \
            --exclude .cache/exclusions.json --report .cache/reconcile-report.md --pseudonym-key .cache/pseudonym.key
      - name: Validate
        if: env.CONFIGURED == 'true'
        run: python tools/validate.py
      - name: Summarize
        if: env.CONFIGURED == 'true'
        run: |
          cat .cache/reconcile-report.md >> "$GITHUB_STEP_SUMMARY"
          git diff --stat -- data/world >> "$GITHUB_STEP_SUMMARY" || true
          { echo "Regenerated \`data/world/\` from every batch in the batch bucket with \`tools/reconcile.py\`. Validated in the workflow."; echo; cat .cache/reconcile-report.md; } > .cache/pr-body.md
      - name: App token
        id: app
        if: env.CONFIGURED == 'true' && vars.RECONCILE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RECONCILE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RECONCILE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: pr
        if: env.CONFIGURED == 'true'
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          branch: reconcile/nightly
          title: "world: reconcile observations"
          commit-message: "world: reconcile observation batches"
          body-path: .cache/pr-body.md
          labels: data,world
          add-paths: data/world
          delete-branch: true
      - name: Merge automatically when the checks pass
        if: env.CONFIGURED == 'true' && steps.app.outputs.token != '' && steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh pr merge "${{ steps.pr.outputs.pull-request-number }}" --auto --merge --repo "$GITHUB_REPOSITORY"
