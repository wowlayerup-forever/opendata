name: uploader build

# Builds the standalone opendata-uploader for each OS with PyInstaller, smoke-tests it on
# that OS, and uploads a zip per platform as an artifact. Called from ci (PRs: build and
# test only) and from addon release (attached to the release). No cloud access.

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows-x64, exe: opendata-uploader.exe }
          - { os: macos-14, platform: macos-arm64, exe: opendata-uploader }
          - { os: macos-15-intel, platform: macos-x64, exe: opendata-uploader }
          - { os: ubuntu-22.04, platform: linux-x64, exe: opendata-uploader }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install "pyinstaller>=6.10,<7"
      - name: Build
        shell: bash
        run: |
          echo "VERSION = \"${{ inputs.version }}\"" > tools/_build_info.py
          pyinstaller --onefile --console --clean --log-level WARN --name opendata-uploader \
            --paths tools --hidden-import _build_info tools/opendata_uploader.py
      - name: Smoke test
        run: python tests/smoke_uploader.py "dist/${{ matrix.exe }}" "${{ inputs.version }}"
      - name: Zip
        shell: bash
        run: |
          python - <<'PY'
          import zipfile, os
          exe, plat, ver = "${{ matrix.exe }}", "${{ matrix.platform }}", "${{ inputs.version }}"
          out = f"dist/opendata-uploader-{ver}-{plat}.zip"
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              info = zipfile.ZipInfo(f"opendata-uploader/{exe}", date_time=(2026, 1, 1, 0, 0, 0))
              info.external_attr = 0o755 << 16
              info.compress_type = zipfile.ZIP_DEFLATED
              z.writestr(info, open(f"dist/{exe}", "rb").read())
              for name in ("LICENSE",):
                  z.write(name, f"opendata-uploader/{name}")
          print(out, os.path.getsize(out))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opendata-uploader-${{ matrix.platform }}
          path: dist/opendata-uploader-*.zip
          retention-days: 7
